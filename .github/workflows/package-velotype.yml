name: Package Velotype for Linux

on:
  # 每 6 小时检查一次上游是否发布了新版本
  schedule:
    - cron: "17 */6 * * *"

  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: velotype-packaging
  cancel-in-progress: false

jobs:
  package:
    name: Download and package Linux releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            jq \
            ca-certificates \
            tar \
            dpkg-dev \
            rpm \
            file

      - name: Get latest upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu

          API_URL="https://api.github.com/repos/manyougz/velotype/releases/latest"

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}" \
            -o release.json

          TAG="$(jq -er '.tag_name' release.json)"
          VERSION="${TAG#v}"

          # 防止上游版本号被用作意外的路径或文件名
          if ! printf '%s' "$VERSION" |
               grep -Eq '^[0-9]+(\.[0-9]+)*([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid upstream version: $VERSION"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Upstream release: $TAG"

          jq -r '.assets[] | "\(.name) \(.digest // "no-digest")"' \
            release.json

      - name: Download and verify Linux archives
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu

          mkdir -p downloads

          download_asset() {
            local asset_name="$1"
            local output="downloads/$1"

            local asset_url
            local digest

            asset_url="$(jq -er \
              --arg name "$asset_name" \
              '.assets[] | select(.name == $name) | .browser_download_url' \
              release.json)"

            digest="$(jq -r \
              --arg name "$asset_name" \
              '.assets[] | select(.name == $name) | .digest // empty' \
              release.json)"

            echo "Downloading: $asset_name"

            curl -fL --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "$asset_url" \
              -o "$output"

            if [ -n "$digest" ]; then
              case "$digest" in
                sha256:*)
                  expected="${digest#sha256:}"
                  actual="$(sha256sum "$output" | awk '{print $1}')"

                  if [ "$actual" != "$expected" ]; then
                    echo "SHA-256 mismatch: $asset_name"
                    echo "Expected: $expected"
                    echo "Actual:   $actual"
                    exit 1
                  fi

                  echo "SHA-256 verified: $asset_name"
                  ;;
                *)
                  echo "Unsupported digest format: $digest"
                  exit 1
                  ;;
              esac
            else
              echo "WARNING: Upstream does not publish a digest for $asset_name"
            fi
          }

          download_asset "velotype-${UPSTREAM_TAG}-linux-x86_64.tar.gz"
          download_asset "velotype-${UPSTREAM_TAG}-linux-aarch64.tar.gz"

      - name: Prepare package metadata
        id: metadata
        env:
          VERSION: ${{ steps.release.outputs.version }}
          UPSTREAM_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu

          mkdir -p work output

          curl -fsSL \
            "https://raw.githubusercontent.com/manyougz/velotype/${UPSTREAM_TAG}/LICENSE-APACHE" \
            -o work/copyright

          cat > work/velotype.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Velotype
          Comment=Native Markdown Editor
          Exec=velotype %F
          Terminal=false
          Categories=Office;TextEditor;
          MimeType=text/markdown;
          StartupNotify=true
          EOF

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build DEB and RPM packages
        env:
          VERSION: ${{ steps.release.outputs.version }}
          UPSTREAM_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu

          build_package() {
            local arch="$1"
            local deb_arch="$2"
            local rpm_arch="$3"

            local archive="downloads/velotype-${UPSTREAM_TAG}-linux-${arch}.tar.gz"
            local extract_dir="$PWD/work/extract-${arch}"
            local root="$PWD/work/root-${arch}"

            echo "========================================"
            echo "Packaging $arch"
            echo "========================================"

            mkdir -p "$extract_dir" "$root"

            # 确认压缩包结构正常后再解压
            tar -tzf "$archive" >/dev/null
            tar -xzf "$archive" -C "$extract_dir"

            # 上游 README 声明 Linux 版本为独立可执行文件。
            # 不依赖具体的压缩包内部目录结构。
            local binary
            binary="$(find "$extract_dir" -type f -executable -print -quit)"

            if [ -z "$binary" ]; then
              echo "No executable found in $archive"
              find "$extract_dir" -maxdepth 3 -type f -print
              exit 1
            fi

            file "$binary"

            # 防止错误架构的二进制被打进安装包
            # 使用 file 的实际输出检查 ELF 架构
            local binary_info
            binary_info="$(file -b "$binary")"
            
            case "$arch" in
              x86_64)
                if ! printf '%s\n' "$binary_info" | grep -Eq 'x86-64|X86-64'; then
                  echo "Unexpected binary architecture for x86_64"
                  echo "$binary_info"
                  exit 1
                fi
                ;;
              aarch64)
                if ! printf '%s\n' "$binary_info" | grep -Eq 'aarch64|AArch64'; then
                  echo "Unexpected binary architecture for aarch64"
                  echo "$binary_info"
                  exit 1
                fi
                ;;
              *)
                echo "Unsupported architecture: $arch"
                exit 1
                ;;
            esac
            
            echo "Architecture verified: $arch"

            # Debian 文件系统布局
            install -D -m 0755 "$binary" \
              "$root/usr/bin/velotype"

            install -D -m 0644 work/velotype.desktop \
              "$root/usr/share/applications/velotype.desktop"

            install -D -m 0644 work/copyright \
              "$root/usr/share/doc/velotype/copyright"

            mkdir -p "$root/DEBIAN"

            cat > "$root/DEBIAN/control" <<EOF
          Package: velotype
          Version: ${VERSION}
          Section: editors
          Priority: optional
          Architecture: ${deb_arch}
          Maintainer: Velotype Package Maintainers
          Homepage: https://github.com/manyougz/velotype
          Depends: libc6, libgcc-s1, libxkbcommon0, libwayland-client0, libwayland-cursor0, libwayland-egl1, libx11-6, libx11-xcb1, libxcb1, libegl1, libfontconfig1
          Description: Native Markdown editor
           Velotype is a native Markdown editor supporting WYSIWYG
           editing and Markdown source editing.
          EOF

            local deb_file="output/velotype_${VERSION}_${deb_arch}.deb"

            dpkg-deb --root-owner-group \
              --build "$root" "$deb_file"

            # RPM 文件系统布局
            local rpm_top="$PWD/work/rpmbuild-${arch}"

            mkdir -p \
              "$rpm_top/BUILD" \
              "$rpm_top/BUILDROOT" \
              "$rpm_top/RPMS" \
              "$rpm_top/SOURCES" \
              "$rpm_top/SPECS" \
              "$rpm_top/SRPMS"

            install -m 0755 "$binary" \
              "$rpm_top/SOURCES/velotype"

            install -m 0644 work/velotype.desktop \
              "$rpm_top/SOURCES/velotype.desktop"

            install -m 0644 work/copyright \
              "$rpm_top/SOURCES/copyright"

            cat > "$rpm_top/SPECS/velotype.spec" <<EOF
          Name:           velotype
          Version:        ${VERSION}
          Release:        1
          Summary:        Native Markdown editor
          License:        Apache-2.0
          URL:            https://github.com/manyougz/velotype
          Source0:        velotype
          Source1:        velotype.desktop
          Source2:        copyright
          BuildArch:      ${rpm_arch}

          %description
          Velotype is a native Markdown editor supporting WYSIWYG
          editing and Markdown source editing.

          %install
          install -D -m 0755 %{SOURCE0} %{buildroot}%{_bindir}/velotype
          install -D -m 0644 %{SOURCE1} %{buildroot}%{_datadir}/applications/velotype.desktop
          install -D -m 0644 %{SOURCE2} %{buildroot}%{_datadir}/licenses/velotype/LICENSE-APACHE

          %files
          %{_bindir}/velotype
          %{_datadir}/applications/velotype.desktop
          %{_datadir}/licenses/velotype/LICENSE-APACHE

          %changelog
          * Mon Oct 19 2026 Velotype Package Maintainers
          - Package upstream release ${UPSTREAM_TAG}
          EOF

            rpmbuild -bb \
              --define "_topdir $rpm_top" \
              "$rpm_top/SPECS/velotype.spec"

            find "$rpm_top/RPMS" -type f -name '*.rpm' \
              -exec cp {} output/ \;

            echo "Packages created for $arch"
          }

          build_package x86_64 amd64 x86_64
          build_package aarch64 arm64 aarch64

          echo "========================================"
          echo "Generated packages:"
          ls -lh output/

      - name: Generate SHA-256 checksums
        run: |
          set -eu
          cd output
          sha256sum *.deb *.rpm > SHA256SUMS
          cat SHA256SUMS

      - name: Publish packages to repository Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          UPSTREAM_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu

          # 使用独立标签，避免与上游版本标签混淆
          PACKAGE_TAG="velotype-${UPSTREAM_TAG}"
          TITLE="Velotype ${UPSTREAM_TAG} Linux Packages"

          if gh release view "$PACKAGE_TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            echo "Release already exists: $PACKAGE_TAG"

          else

            gh release create "$PACKAGE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "Linux DEB/RPM packages for upstream Velotype ${UPSTREAM_TAG}.

          Upstream: https://github.com/manyougz/velotype/releases/tag/${UPSTREAM_TAG}

          Architectures:
          - x86_64 / amd64
          - aarch64 / arm64

          Packages are generated from upstream prebuilt Linux binaries."

          fi

          # 同一上游版本重复运行时，更新已有安装包
          gh release upload "$PACKAGE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            output/*.deb \
            output/*.rpm \
            output/SHA256SUMS

          echo "Published: $PACKAGE_TAG"
