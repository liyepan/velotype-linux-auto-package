name: Package Velotype for Linux x86_64

on:
  schedule:
    - cron: "17 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: velotype-packaging
  cancel-in-progress: false

jobs:
  package:
    name: Build DEB and RPM
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. 检出自己的打包仓库
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. 安装打包工具
      # ============================================================
      - name: Install dependencies
        run: |
          set -eu

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            jq \
            ca-certificates \
            tar \
            dpkg-dev \
            rpm \
            file \
            binutils

      # ============================================================
      # 3. 获取上游最新 Release
      # ============================================================
      - name: Get latest upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu

          API_URL="https://api.github.com/repos/manyougz/velotype/releases/latest"

          curl -fsSL \
            --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL" \
            -o release.json

          TAG="$(jq -er '.tag_name' release.json)"
          VERSION="${TAG#v}"

          if ! printf '%s\n' "$VERSION" |
               grep -Eq '^[0-9]+(\.[0-9]+)*([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          ASSET="velotype-${TAG}-linux-x86_64.tar.gz"

          # 确认最新 Release 包含 x86_64 Linux 资产
          jq -e --arg name "$ASSET" \
            '.assets[] | select(.name == $name)' \
            release.json >/dev/null

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

          echo "Upstream tag: $TAG"
          echo "Version: $VERSION"
          echo "Asset: $ASSET"

      # ============================================================
      # 4. 下载并验证上游压缩包
      # ============================================================
      - name: Download upstream release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -eu

          mkdir -p downloads

          URL="$(jq -er \
            --arg name "$ASSET" \
            '.assets[] | select(.name == $name) | .browser_download_url' \
            release.json)"

          EXPECTED="$(jq -r \
            --arg name "$ASSET" \
            '.assets[] | select(.name == $name) | .digest // empty' \
            release.json)"

          # 兼容上游没有提供 digest 的情况
          if [ -z "$EXPECTED" ] && [ "$UPSTREAM_TAG" = "v0.7.8" ]; then
            EXPECTED="sha256:d829d560f270bd9088fa4db24100373241841f02742b954309e47d3e85f65378"
          fi

          ARCHIVE="downloads/$ASSET"

          curl -fLsS \
            --retry 3 \
            --retry-delay 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "$URL" \
            -o "$ARCHIVE"

          if [ -n "$EXPECTED" ]; then
            case "$EXPECTED" in
              sha256:*)
                EXPECTED="${EXPECTED#sha256:}"
                ;;
              *)
                echo "Unsupported digest: $EXPECTED"
                exit 1
                ;;
            esac

            ACTUAL="$(sha256sum "$ARCHIVE" | awk '{print $1}')"

            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "SHA-256 verification failed"
              echo "Expected: $EXPECTED"
              echo "Actual:   $ACTUAL"
              exit 1
            fi

            echo "SHA-256 verified"
          else
            echo "WARNING: Upstream has no SHA-256 digest."
          fi

          tar -tzf "$ARCHIVE" >/dev/null

      # ============================================================
      # 5. 解压并检查上游文件
      # ============================================================
      - name: Extract and verify binary
        env:
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -eu

          mkdir -p work/extract

          tar -xzf "downloads/$ASSET" \
            -C work/extract

          # 根据已知上游目录结构定位程序
          BINARY="$(find work/extract \
            -type f -name velotype -print -quit)"

          if [ -z "$BINARY" ]; then
            echo "Cannot find velotype executable"
            find work/extract -maxdepth 4 -type f -print
            exit 1
          fi

          # 确认 ELF 文件确实为 x86_64
          ELF_MACHINE="$(readelf -h "$BINARY" |
            awk -F: '/Machine:/ {
              sub(/^[[:space:]]+/, "", $2)
              print $2
            }')"

          echo "ELF machine: $ELF_MACHINE"

          if [ "$ELF_MACHINE" != "Advanced Micro Devices X86-64" ]; then
            echo "Unexpected ELF architecture"
            exit 1
          fi

          chmod 0755 "$BINARY"

          echo "Binary verified: $BINARY"

      # ============================================================
      # 6. 准备通用安装文件
      # ============================================================
      - name: Prepare package files
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -eu

          mkdir -p \
            work/payload/opt/velotype \
            work/payload/usr/bin \
            work/payload/usr/share/applications \
            work/payload/usr/share/doc/velotype \
            output

          BINARY="$(find work/extract \
            -type f -name velotype -print -quit)"

          # 保留上游程序的目录布局
          cp -a "$(dirname "$BINARY")/." \
            work/payload/opt/velotype/

          chmod 0755 work/payload/opt/velotype/velotype

          # 创建统一启动入口
          cat > work/payload/usr/bin/velotype <<'EOF'
          #!/bin/sh
          exec /opt/velotype/velotype "$@"
          EOF

          chmod 0755 work/payload/usr/bin/velotype

          # 使用上游许可证
          LICENSE="$(find work/extract \
            -type f -name LICENSE-APACHE -print -quit)"

          if [ -n "$LICENSE" ]; then
            install -m 0644 "$LICENSE" \
              work/payload/usr/share/doc/velotype/copyright
          else
            echo "Upstream LICENSE-APACHE not found"
            exit 1
          fi

          # 桌面启动器
          cat > work/payload/usr/share/applications/velotype.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Velotype
          Comment=Native Markdown Editor
          Exec=velotype %F
          Terminal=false
          Categories=Office;TextEditor;
          MimeType=text/markdown;
          StartupNotify=true
          EOF

          echo "Package files prepared"

      # ============================================================
      # 7. 构建 DEB
      # ============================================================
      - name: Build DEB package
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -eu

          ROOT="$PWD/work/deb-root"

          mkdir -p "$ROOT"

          cp -a work/payload/. "$ROOT/"

          mkdir -p "$ROOT/DEBIAN"

          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: velotype
          Version: ${VERSION}
          Section: editors
          Priority: optional
          Architecture: amd64
          Maintainer: Velotype Package Maintainers
          Homepage: https://github.com/manyougz/velotype
          Description: Native Markdown editor
           Velotype is a native Markdown editor.
          EOF

          dpkg-deb \
            --root-owner-group \
            --build \
            "$ROOT" \
            "output/velotype_${VERSION}_amd64.deb"

          echo "DEB package created"

      # ============================================================
      # 8. 构建 RPM
      # ============================================================
      - name: Build RPM package
        env:
          VERSION: ${{ steps.release.outputs.version }}
          UPSTREAM_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu

          RPMROOT="$PWD/work/rpmbuild"

          mkdir -p \
            "$RPMROOT/BUILD" \
            "$RPMROOT/BUILDROOT" \
            "$RPMROOT/RPMS" \
            "$RPMROOT/SOURCES" \
            "$RPMROOT/SPECS" \
            "$RPMROOT/SRPMS"

          # RPM 使用同一套文件布局
          tar -czf "$RPMROOT/SOURCES/payload.tar.gz" \
            -C work/payload .

          cat > "$RPMROOT/SPECS/velotype.spec" <<EOF
          Name:           velotype
          Version:        ${VERSION}
          Release:        1
          Summary:        Native Markdown editor
          License:        Apache-2.0
          URL:            https://github.com/manyougz/velotype
          Source0:        payload.tar.gz
          BuildArch:      x86_64

          %description
          Velotype is a native Markdown editor.

          %prep
          %setup -q -c -T
          tar -xzf %{SOURCE0}

          %build

          %install
          mkdir -p %{buildroot}
          cp -a . %{buildroot}/

          %files
          /opt/velotype/
          /usr/bin/velotype
          /usr/share/applications/velotype.desktop
          /usr/share/doc/velotype/copyright

          %changelog
          * Mon Oct 19 2026 Velotype Package Maintainers
          - Package upstream release ${UPSTREAM_TAG}
          EOF

          rpmbuild -bb \
            --target x86_64 \
            --define "_topdir $RPMROOT" \
            "$RPMROOT/SPECS/velotype.spec"

          find "$RPMROOT/RPMS" \
            -type f -name '*.rpm' \
            -exec cp {} output/ \;

          echo "RPM package created"

      # ============================================================
      # 9. 检查安装包
      # ============================================================
      - name: Verify packages
        run: |
          set -eu

          echo "Generated packages:"
          ls -lh output/

          DEB="$(find output -maxdepth 1 -name '*.deb' -print -quit)"
          RPM="$(find output -maxdepth 1 -name '*.rpm' -print -quit)"

          test -n "$DEB"
          test -n "$RPM"

          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"

          rpm -qip "$RPM"
          rpm -qlp "$RPM"

          cd output
          sha256sum *.deb *.rpm > SHA256SUMS

          cat SHA256SUMS

      # ============================================================
      # 10. 发布到自己的 GitHub Release
      # ============================================================
      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          UPSTREAM_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu

          PACKAGE_TAG="velotype-${UPSTREAM_TAG}"

          if gh release view "$PACKAGE_TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            echo "Release already exists: $PACKAGE_TAG"

          else

            gh release create "$PACKAGE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Velotype ${UPSTREAM_TAG} Linux x86_64 Packages" \
              --notes "Linux x86_64 DEB and RPM packages for Velotype ${UPSTREAM_TAG}.

          Upstream:
          https://github.com/manyougz/velotype/releases/tag/${UPSTREAM_TAG}

          Architecture: x86_64

          Packages:
          - Debian/Ubuntu amd64
          - Fedora/RHEL x86_64"

          fi

          gh release upload "$PACKAGE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            output/*.deb \
            output/*.rpm \
            output/SHA256SUMS

          echo "Published Release: $PACKAGE_TAG"
